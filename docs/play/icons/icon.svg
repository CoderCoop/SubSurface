<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Source for the PWA icons. The PNGs beside this file are rendered from it.
    Keep the payload column and crystal inside the middle 60% so the maskable
    variant survives being cropped to a circle.
  -->
  <defs>
    <linearGradient id="fluid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cebdd" />
      <stop offset="100%" stop-color="#17a99c" />
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#fff7cf" />
      <stop offset="100%" stop-color="#dfcb76" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#14110e" />

  <!-- strata -->
  <rect y="150" width="512" height="104" fill="#8c4a32" />
  <rect y="254" width="512" height="74" fill="#c9a26b" />
  <rect y="328" width="512" height="104" fill="#7f4229" />
  <rect y="432" width="512" height="80" fill="#3a3a42" />

  <!-- reservoir resting on the seal -->
  <rect y="88" width="512" height="62" fill="url(#fluid)" />

  <!-- the carved channel, cut down the middle -->
  <path
    d="M256 96 C 240 200, 272 280, 256 400"
    stroke="#14110e"
    stroke-width="86"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M256 96 C 240 200, 272 280, 256 400"
    stroke="url(#fluid)"
    stroke-width="52"
    stroke-linecap="round"
    fill="none"
  />

  <!-- collector crystal -->
  <g>
    <polygon points="196,446 224,384 252,446" fill="url(#crystal)" />
    <polygon points="232,446 262,372 292,446" fill="url(#crystal)" />
    <polygon points="272,446 300,390 328,446" fill="url(#crystal)" />
    <polygon points="224,384 232,446 196,446" fill="#c9b667" opacity="0.5" />
    <polygon points="262,372 272,446 232,446" fill="#c9b667" opacity="0.4" />
  </g>
</svg>
